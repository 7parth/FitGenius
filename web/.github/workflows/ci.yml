name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "web/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "web/**"

defaults:
  run:
    working-directory: web

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend — lint, type-check, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fitgenius_test
          POSTGRES_PASSWORD: fitgenius_test
          POSTGRES_DB: fitgenius_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fitgenius_test -d fitgenius_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://fitgenius_test:fitgenius_test@localhost:5432/fitgenius_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production-use
      ENVIRONMENT: test
      DEBUG: "false"
      OPENAI_API_KEY: ""
      RATE_LIMIT_REGISTER: "1000/minute"
      RATE_LIMIT_LOGIN: "1000/minute"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/backend/requirements.txt

      - name: Install dependencies
        working-directory: web/backend
        run: pip install --no-cache-dir -r requirements.txt

      - name: Lint with ruff
        working-directory: web/backend
        run: ruff check .

      - name: Format check with black
        working-directory: web/backend
        run: black --check .

      - name: Verify imports compile
        working-directory: web/backend
        run: python -m py_compile app/main.py

      - name: Run Alembic migrations (001 + 002)
        working-directory: web/backend
        run: alembic upgrade head

      - name: Run tests (including RBAC + ML recommendation tests)
        working-directory: web/backend
        run: pytest tests/ -v --tb=short -x

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — type-check, lint, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        working-directory: web/frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: web/frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: web/frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000

  # ── E2E tests (Playwright, public pages only) ────────────────────────────────
  e2e:
    name: E2E — Playwright smoke tests
    runs-on: ubuntu-latest
    needs: [frontend]
    # Run on PRs to main and pushes to develop (public-page tests, no backend needed)
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web/frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E (public page subset)
        working-directory: web/frontend
        run: >
          npx playwright test
          e2e/auth.spec.ts
          e2e/accessibility.spec.ts
          e2e/pwa.spec.ts
          --project=chromium
          --reporter=list
          --grep "login page|register page|skip link|404|robots|favicon|manifest|load within|viewport|images missing"
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/frontend/playwright-report/
          retention-days: 7

  # ── Docker build smoke test ───────────────────────────────────────────────
  docker:
    name: Docker — build images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: web/backend
          file: web/backend/Dockerfile.prod
          push: false
          tags: fitgenius-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: web/frontend
          file: web/frontend/Dockerfile.prod
          push: false
          tags: fitgenius-frontend:${{ github.sha }}
          build-args: VITE_API_BASE_URL=https://api.fitgenius.app
          cache-from: type=gha
          cache-to: type=gha,mode=max
