[tool.ruff]
target-version = "py311"
line-length = 110
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "COM", "C4", "DTZ", "T20", "RET", "SIM"]
ignore = [
    "S101",   # assert is fine in tests
    "S105",   # hardcoded password — false positives in config defaults
    "S106",
    "S311",   # random is fine for non-crypto use
    "COM812", # trailing comma — handled by formatter
    "N805",   # first arg of class methods — conflicts with pydantic validators
    "B008",   # do not perform function calls in default arguments — FastAPI pattern
    "RET504", # unnecessary assignment before return
    "SIM108", # use ternary — not always more readable
]
exclude = ["alembic/versions/"]

[tool.ruff.per-file-ignores]
"tests/**" = ["S101", "S106", "T20"]
"scripts/**" = ["T20"]

[tool.black]
line-length = 110
target-version = ["py311"]
exclude = "alembic/versions/"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
