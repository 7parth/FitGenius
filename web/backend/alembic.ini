# Alembic configuration file
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts
script_location = alembic

# Template for revision file names
file_template = %%(rev)s_%%(slug)s

# sys.path tweak — project root is one level up from this ini
prepend_sys_path = .

# Timezone for revision timestamps
timezone = UTC

# Max length of slug in filenames
truncate_slug_length = 40

# Database URL — overridden by env.py reading from environment variable
# Leave as placeholder; never commit real credentials here
sqlalchemy.url = driver://user:pass@host/dbname

[post_write_hooks]
# No post-write hooks

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
